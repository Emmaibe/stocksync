# ---------------------------------------------------------------------------
# TEMPLATE ONLY — do not commit real values, and do not `kubectl apply` this.
#
# Create the real secret once, on the server, out of band:
#
#   kubectl create secret generic stocksync-secrets -n stocksync \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=DB_PASSWORD='...' \
#     --from-literal=MAIL_USERNAME='...' \
#     --from-literal=MAIL_PASSWORD='...'
#
# Rotating JWT_SECRET invalidates every token in circulation: everyone is signed
# out at once. That is the intended behaviour in a breach and an unpleasant
# surprise otherwise.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: stocksync-secrets
  namespace: stocksync
type: Opaque
stringData:
  JWT_SECRET: "replace-me-at-least-32-bytes-long"
  DB_PASSWORD: "replace-me"
  MAIL_USERNAME: "replace-me"
  MAIL_PASSWORD: "replace-me"
