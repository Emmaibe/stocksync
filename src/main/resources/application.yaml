spring:
  application:
    name: stocksync
  config:
    import: optional:file:.env[.properties]

  mail:
    # No host here on purpose. @ConditionalOnProperty treats an empty value as
    # present, so ${MAIL_HOST:} would switch on the SMTP transport with nowhere to
    # send. Leaving it unset means the application logs emails instead — the right
    # behaviour on a laptop and in CI — and setting SPRING_MAIL_HOST in the
    # environment turns on real delivery.
    port: ${MAIL_PORT:587}
    # No defaults. These were real Gmail credentials, which meant anyone with the
    # repository had a working mail account, and the person who rotated that
    # account would break this application without knowing it existed.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
        transport:
          protocol: smtp

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stocksync}
    username: ${DB_USERNAME:lordibe}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: stocksync-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Never let Hibernate create or alter it.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    # Jackson 3 (Boot 4) already writes dates as ISO-8601 strings and ignores
    # unknown properties by default, so only the null handling needs stating.
    default-property-inclusion: non_null

  web:
    error:
      # Moved here from server.error.* in Boot 4. Messages and field-level binding
      # errors help API clients; stack traces never leave the server.
      include-message: always
      include-binding-errors: always
      include-stacktrace: never

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        # Operational checks live here and NOT in the probes. A mail backlog or an
        # unreachable SMTP server must never take pods out of the load balancer:
        # the API can still record stock, and pulling the pods would turn a mail
        # problem into an outage. Readiness answers "can this pod serve traffic";
        # this group answers "is anything rotting quietly".
        #
        # Requires a token (see SecurityConfig) because the details name the mail
        # server and the database.
        #
        # 'mail' is deliberately NOT a member. Boot validates group membership at
        # startup, and the mail contributor only exists when spring.mail.host is
        # set — which it is not on a laptop or in CI, by design. Listing it would
        # mean the application starts in production and refuses to start
        # everywhere else. SMTP trouble shows up through 'outbox' anyway, which
        # is the symptom that actually matters.
        ops:
          include: db,outbox
          show-details: when-authorized

logging:
  level:
    root: INFO
    com.lordibe.stocksync: DEBUG

stocksync:
  tenancy:
    # Fail closed: reject a persistence call that has no tenant in context.
    require-tenant-context: true
  inventory:
    # Off: a sale or transfer may not drive a slot below zero.
    allow-negative-stock: false
  web:
    cors:
      # Comma-separated in the environment; a browser client that is not listed
      # here cannot call the API at all.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  email:
    # Envelope sender, and where the links in emails point (the web app, not this
    # API). A wrong base URL means every invitation link is broken.
    from-address: ${MAIL_FROM:no-reply@stocksync.local}
    from-name: ${MAIL_FROM_NAME:StockSync}
    app-base-url: ${APP_BASE_URL:http://localhost:3000}
    dispatch-batch-size: ${MAIL_BATCH_SIZE:25}
    dispatch-interval-ms: ${MAIL_DISPATCH_INTERVAL_MS:30000}
    # How long a message may sit unsent before the ops health check calls the
    # queue stalled. The dispatcher runs every 30 seconds, so anything waiting
    # this long is failing and backing off, not merely queued.
    stalled-after-minutes: ${MAIL_STALLED_AFTER_MINUTES:15}
  security:
    jwt:
      # No default, and this time actually no default. A committed key is a
      # known key: anyone holding it can mint a token for any tenant and any
      # permission. Startup fails without JWT_SECRET, which is the intended
      # behaviour — tests supply a throwaway one, production reads the secret.
      # Must be at least 32 bytes for HS256.
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:stocksync}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
